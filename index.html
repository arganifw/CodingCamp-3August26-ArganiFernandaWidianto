<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Utama -->
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN untuk Diagram Lingkaran -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header & Tombol Mode Gelap/Terang -->
        <header>
            <h1>Expense & Budget Visualizer</h1>
            <button id="theme-toggle" class="btn-secondary">🌙 Mode</button>
        </header>

        <!-- Total Saldo -->
        <section class="balance-card">
            <p>TOTAL BALANCE</p>
            <h2 id="total-balance">$0.00</h2>
        </section>

        <!-- Form Input Transaksi -->
        <section class="card">
            <h3>Add Transaction</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" placeholder="Contoh: Cilok" required>
                </div>

                <div class="form-group">
                    <label for="item-amount">Amount</label>
                    <input type="number" id="item-amount" step="0.01" placeholder="Contoh: 14.94" required>
                </div>

                <div class="form-group">
                    <label for="item-category">Category</label>
                    <select id="item-category" required>
                        <option value="" disabled selected>Pilih Kategori</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </div>

                <!-- Opsi Tambah Kategori Kustom -->
                <div class="form-group">
                    <label for="custom-category">Atau Tambah Kategori Baru</label>
                    <div class="custom-cat-wrapper">
                        <input type="text" id="custom-category" placeholder="Kategori baru...">
                        <button type="button" id="add-category-btn" class="btn-secondary">Tambah</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Add Transaction</button>
            </form>
        </section>

        <!-- Visualisasi Chart -->
        <section class="card">
            <h3>Spending by Category</h3>
            <div class="chart-container">
                <canvas id="spendingChart"></canvas>
            </div>
        </section>

        <!-- Daftar Transaksi & Fitur Sorting -->
        <section class="card">
            <div class="list-header">
                <h3>Transactions</h3>
                <div class="sort-wrapper">
                    <label for="sort-select">Urutkan:</label>
                    <select id="sort-select">
                        <option value="default">Default</option>
                        <option value="amount-desc">Jumlah (Tertinggi)</option>
                        <option value="amount-asc">Jumlah (Terendah)</option>
                        <option value="category">Kategori</option>
                    </select>
                </div>
            </div>
            
            <div class="transaction-scroll">
                <ul id="transaction-list">
                    <!-- Daftar transaksi akan masuk secara dinamis lewat JS -->
                </ul>
            </div>
        </section>
    </div>

    <!-- JavaScript Utama -->
    <script src="script.js"></script>
</body>
</html>
